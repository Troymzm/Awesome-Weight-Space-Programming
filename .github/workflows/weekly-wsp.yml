name: Weekly WSP literature update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
      timezone: Asia/Shanghai

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-wsp-update
  cancel-in-progress: false

jobs:
  propose-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_BRANCH: ${{ github.ref_name }}
      UPDATE_BRANCH: automation/weekly-wsp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the catalog update branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --prune origin
          base_ref="refs/remotes/origin/$BASE_BRANCH"
          update_ref="refs/remotes/origin/$UPDATE_BRANCH"
          git switch --create "$UPDATE_BRANCH" "$base_ref"

          if git show-ref --verify --quiet "$update_ref"; then
            changed_paths=$(git diff --name-only "$base_ref...$update_ref" -- . \
              ':!data/catalog.json' ':!README.md' ':!README.zh-CN.md' ':!references.bib')
            if [[ -n "$changed_paths" ]]; then
              echo 'The update branch has non-catalog changes. Review it before the next run.' >&2
              exit 1
            fi
            closed_head=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f "head=$GITHUB_REPOSITORY_OWNER:$UPDATE_BRANCH" -f "base=$BASE_BRANCH" \
              -f state=all -f sort=created -f direction=desc -F per_page=1 \
              --jq '.[0] | select(.state == "closed") | .head.sha')
            if [[ "$closed_head" == "$(git rev-parse "$update_ref")" ]]; then
              # Keep the branch history while starting from the reviewed catalog.
              git merge --no-edit --no-ff --strategy=ours "$update_ref"
            elif git merge-base --is-ancestor "$base_ref" "$update_ref"; then
              git merge --ff-only "$update_ref"
            elif ! git merge-base --is-ancestor "$update_ref" "$base_ref"; then
              # Merge the catalog by record identity and regenerate its outputs.
              git merge --no-commit --no-ff --strategy=ours "$update_ref"
              python -B scripts/wsp_merge.py "$base_ref" "$update_ref"
              git add -- data/catalog.json README.md README.zh-CN.md references.bib
              git diff --cached --check
              git commit -m 'Merge the latest reviewed catalog into the weekly proposal'
            fi
          fi

      - name: Test the updater
        run: python -B -m unittest discover -s scripts/tests -v

      - name: Check arXiv and render proposed changes
        id: scan
        run: |
          report="$RUNNER_TEMP/wsp-weekly.md"
          status=0
          python -B scripts/wsp_weekly.py --report "$report" || status=$?
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Create or update the draft pull request
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/wsp-weekly.md" ]]; then
            echo 'The updater stopped before producing a report. Skipping publication.' >&2
            exit 1
          fi

          base_ref="refs/remotes/origin/$BASE_BRANCH"
          update_ref="refs/remotes/origin/$UPDATE_BRANCH"
          catalog_paths=(data/catalog.json README.md README.zh-CN.md references.bib)
          git add -- "${catalog_paths[@]}"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Update WSP literature catalog'
          fi

          if git diff --quiet "$base_ref" HEAD -- "${catalog_paths[@]}"; then
            echo 'The current catalog has no proposed updates.'
            exit 0
          fi

          existing_pr="$RUNNER_TEMP/wsp-open-pr.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f "head=$GITHUB_REPOSITORY_OWNER:$UPDATE_BRANCH" -f "base=$BASE_BRANCH" \
            -f state=open -F per_page=1 > "$existing_pr"
          pr_body="$RUNNER_TEMP/wsp-pr.md"
          summary=$(python -B scripts/wsp_pr.py "$base_ref" "$existing_pr" "$pr_body")
          read -r pull_number body_changed <<< "$summary"

          if ! git show-ref --verify --quiet "$update_ref" ||
              ! git diff --quiet "$update_ref" HEAD -- "${catalog_paths[@]}"; then
            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi

          if [[ "$pull_number" == 0 ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f "head=$UPDATE_BRANCH" -f "base=$BASE_BRANCH" -F draft=true \
              -f 'title=Weekly WSP literature update' -F "body=@$pr_body" --jq '.html_url'
          elif [[ "$body_changed" == 1 ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pull_number" \
              -F "body=@$pr_body" --jq '.html_url'
          else
            echo 'The draft summary already matches the pending catalog changes.'
          fi
